<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KsiS — The Forgotten Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Press+Start+2P&family=Asta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<!-- ============================================================
  Firebase (compat SDK — 단일 파일 구조 유지를 위해 compat 버전 사용)
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --sidebar-bg-top:#1c3a2d;
    --sidebar-bg-bottom:#122019;
    --main-bg:#141414;
    --gold:#c8a24a;
    --gold-dim:#8a7534;
    --green:#4f8a6d;
    --green-dim:#2c5443;
    --green-light:#a9d3bf;
    --text:#e7e7df;
    --text-dim:#7f9188;
    --danger:#b5533f;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;
    background:var(--main-bg);
    font-family:'Press Start 2P', monospace;
    color:var(--text);
    overflow:hidden;
  }

  /* -------- 픽셀 버튼(눌림 베벨) 공통 스타일 -------- */
  .pixel-btn{
    font-family:'Press Start 2P', monospace;
    cursor:pointer;
    box-shadow:
      inset -2px -2px 0 0 rgba(0,0,0,.45),
      inset 2px 2px 0 0 rgba(255,255,255,.22);
  }
  .pixel-btn:active{
    box-shadow:
      inset 2px 2px 0 0 rgba(0,0,0,.45),
      inset -2px -2px 0 0 rgba(255,255,255,.22);
  }

  /* -------- RPG 대화창 스타일 테두리 박스 -------- */
  .rpg-box{
    border:2px solid var(--gold);
    outline:1px solid var(--gold-dim);
    outline-offset:-6px;
  }

  /* ================= SIDEBAR ================= */
  #sidebar{
    width:320px;
    min-width:320px;
    height:100vh;
    background:linear-gradient(180deg,var(--sidebar-bg-top),var(--sidebar-bg-bottom));
    border-right:2px solid var(--gold-dim);
    display:flex;
    flex-direction:column;
    padding:22px 20px;
    gap:22px;
    overflow:hidden;
  }

  .logo-mini{
    font-family:'Uncial Antiqua',serif;
    font-weight:900;
    font-size:36px;
    letter-spacing:1px;
    color:var(--gold);
    line-height:1;
  }
  .logo-mini-sub{
    font-size:8px;
    letter-spacing:1px;
    color:var(--text-dim);
    margin-top:8px;
    font-family:'Press Start 2P', monospace;
  }

  /* -------- youtube player controls -------- */
  .player-row{
    display:flex;
    gap:10px;
  }
  .player-btn{
    width:44px;height:44px;
    background:var(--green-dim);
    border:2px solid var(--green);
    color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:14px;
  }
  .player-btn:hover{background:var(--green);color:#0e1a15;}
  .player-btn.active{background:var(--gold);color:#0e1a15;}
  #ytHost{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;}

  /* -------- add-link form -------- */
  .menu-form{
    background:#0f1c16;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .field-row{display:flex;align-items:center;gap:8px;min-width:0;}
  .field-label{
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-dim);
    width:52px;
    flex-shrink:0;
  }
  .field-input{
    flex:1;
    min-width:0;
    background:var(--green-dim);
    border:2px solid var(--green);
    color:var(--text);
    padding:8px 8px;
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    outline:none;
    box-shadow:inset -2px -2px 0 0 rgba(0,0,0,.4), inset 2px 2px 0 0 rgba(0,0,0,.2);
  }
  .field-input::placeholder{color:#9fbcae;opacity:.5;}
  .field-input:focus{border-color:var(--gold);}
  .add-link-btn{
    align-self:flex-end;
    background:var(--green-dim);
    border:2px solid var(--green);
    color:var(--gold);
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    letter-spacing:1px;
    cursor:pointer;
    padding:8px 10px;
  }
  .add-link-btn:hover{background:var(--green);color:#0e1a15;}

  /* -------- menu list -------- */
  #menuList{
    list-style:none;
    margin:0;padding:0;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    scrollbar-width:thin;
    scrollbar-color:var(--green) transparent;
  }
  #menuList::-webkit-scrollbar{width:6px;}
  #menuList::-webkit-scrollbar-thumb{background:var(--green-dim);}

  .menu-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:10px 8px;
    cursor:pointer;
    border-left:3px solid transparent;
    font-size:13px;
    line-height:1.7;
    word-break:break-word;
    color:var(--text-dim);
  }
  .menu-item:hover{color:var(--text);background:rgba(79,138,109,.15);}
  .menu-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(200,162,74,.08);}
  .menu-item .x-btn{
    color:var(--danger);
    flex-shrink:0;
    font-size:11px;
    margin-top:2px;
    opacity:.55;
  }
  .menu-item:hover .x-btn{opacity:1;}
  .menu-item .m-name{flex:1;}

  .empty-hint{
    color:var(--text-dim);
    font-size:11px;
    line-height:1.8;
    padding:10px 8px;
    letter-spacing:1px;
  }

  /* ================= MAIN CONTENT ================= */
  #main{
    flex:1;
    height:100vh;
    position:relative;
    background:
      radial-gradient(ellipse at 50% 40%, #1c1c1c 0%, #0d0d0d 75%);
    overflow:hidden;
  }

  #waitingScreen{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
  }
  .logo-big{
    font-family:'Uncial Antiqua',serif;
    font-weight:900;
    font-size:min(13vw,170px);
    letter-spacing:8px;
    color:var(--gold);
    line-height:1;
  }
  .logo-big-sub{
    font-family:'Press Start 2P', monospace;
    font-weight:600;
    font-size:20px;
    letter-spacing:6px;
    color:#f2f2ea;
    margin-top:16px;
  }
  .logo-tagline{
    margin-top:36px;
    font-family:'Press Start 2P', monospace;
    font-size:15px;
    letter-spacing:3px;
    color:#cfd8d2;
  }
  .logo-copyright{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:1px;
    color:#9aa39d;
  }
  .logo-hint{
    margin-top:40px;
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    letter-spacing:2px;
    color:var(--gold);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .logo-hint{animation:none;}
  }

  #contentFrame{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:none;
    display:none;
    background:#000;
  }

  #closeContentBtn{
    position:absolute;
    top:14px;right:18px;
    z-index:5;
    display:none;
    background:rgba(20,20,20,.85);
    border:2px solid var(--gold-dim);
    color:var(--gold);
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    padding:8px 12px;
    cursor:pointer;
    letter-spacing:1px;
  }
  #closeContentBtn:hover{border-color:var(--gold);color:#fff;}

  /* -------- 삭제 확인 모달 -------- */
  .confirm-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
  }
  .confirm-overlay.show{display:flex;}
  .confirm-box{
    background:#0f1c16;
    padding:30px 34px;
    max-width:320px;
    text-align:center;
  }
  .confirm-text{
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    line-height:2;
    color:var(--text);
    margin:0 0 26px;
  }
  .confirm-actions{
    display:flex;
    gap:14px;
    justify-content:center;
  }
  .confirm-actions .pixel-btn{
    font-size:12px;
    padding:10px 18px;
    background:var(--green-dim);
    color:var(--gold);
    border:2px solid var(--green);
  }
  .confirm-actions .pixel-btn:hover{background:var(--green);color:#0e1a15;}
  #confirmYes{border-color:var(--danger) !important;}
  #confirmYes:hover{background:var(--danger) !important;color:#fff !important;}
</style>
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">

    <div>
      <div class="logo-mini">KasiS</div>
      <div class="logo-mini-sub">THE FORGOTTEN PATH</div>
    </div>

    <div class="player-row">
      <div class="player-btn pixel-btn" id="playBtn" title="재생">▶</div>
      <div class="player-btn pixel-btn" id="pauseBtn" title="정지">❚❚</div>
    </div>
    <div id="ytHost"></div>

    <div class="menu-form rpg-box">
      <div class="field-row">
        <span class="field-label">MENU</span>
        <input class="field-input" id="menuNameInput" placeholder="title" maxlength="24">
      </div>
      <div class="field-row">
        <span class="field-label">LINK</span>
        <input class="field-input" id="menuLinkInput" placeholder="https://...">
      </div>
      <button class="add-link-btn pixel-btn" id="addLinkBtn">+ ADD LINK</button>
    </div>

    <ul id="menuList">
      <li class="empty-hint">등록된 메뉴가 없습니다</li>
    </ul>

  </aside>

  <!-- ================= MAIN ================= -->
  <main id="main">
    <button id="closeContentBtn" class="pixel-btn">✕ CLOSE</button>

    <div id="waitingScreen">
      <div class="logo-big">KasiS</div>
      <div class="logo-big-sub">THE FORGOTTEN PATH</div>
      <div class="logo-tagline">A DOS ADVENTURE</div>
      <div class="logo-copyright">(C) 1991 PIXELCAT SOFTWARE</div>
      <div class="logo-hint">▶ 메뉴를 선택하세요 ◀</div>
    </div>

    <iframe id="contentFrame"></iframe>
  </main>

  <!-- ================= 삭제 확인 모달 ================= -->
  <div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box rpg-box">
      <p class="confirm-text">정말로<br>삭제하시겠습니까?</p>
      <div class="confirm-actions">
        <button id="confirmYes" class="pixel-btn">예</button>
        <button id="confirmNo" class="pixel-btn">아니오</button>
      </div>
    </div>
  </div>

<script>
/* =====================================================================
   Firebase 설정
   → https://console.firebase.google.com 에서 프로젝트 생성 후
     '웹 앱 추가'로 발급받은 config 값을 아래에 그대로 붙여넣으세요.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDdwSkHiw0l9XsRSOrf6_1r0Izitb7PV9U",
  authDomain: "kasis-tfp.firebaseapp.com",
  databaseURL: "https://kasis-tfp-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kasis-tfp",
  storageBucket: "kasis-tfp.firebasestorage.app",
  messagingSenderId: "973760135804",
  appId: "1:973760135804:web:34383d9ca53d2c39bffff9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const menuCollection = db.collection("menuItems");

/* =====================================================================
   메뉴 목록 (실시간 동기화 — 누구든 추가/삭제하면 모든 접속자에게 반영)
   ===================================================================== */
const menuListEl = document.getElementById("menuList");
let activeId = null;

menuCollection.orderBy("createdAt", "asc").onSnapshot(snapshot => {
  menuListEl.innerHTML = "";

  if (snapshot.empty) {
    menuListEl.innerHTML = `<li class="empty-hint">등록된 메뉴가 없습니다</li>`;
    return;
  }

  snapshot.forEach(doc => {
    const data = doc.data();
    const li = document.createElement("li");
    li.className = "menu-item" + (doc.id === activeId ? " active" : "");
    li.innerHTML = `<span class="x-btn">✕</span><span class="m-name"></span>`;
    li.querySelector(".m-name").textContent = data.name;

    // 좌클릭 → 우측 화면에 링크 출력
    li.addEventListener("click", (e) => {
      if (e.target.classList.contains("x-btn")) return;
      openLink(doc.id, data.link);
    });

    // X 아이콘 클릭 → 삭제 확인창
    li.querySelector(".x-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      requestDelete(doc.id);
    });

    // 우클릭 → 삭제 확인창
    li.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      requestDelete(doc.id);
    });

    menuListEl.appendChild(li);
  });
}, err => {
  menuListEl.innerHTML = `<li class="empty-hint">Firebase 연결 오류 — config 확인 필요</li>`;
  console.error(err);
});

/* -------- 삭제 확인 모달 -------- */
const confirmOverlay = document.getElementById("confirmOverlay");
let pendingDeleteId = null;

function requestDelete(id){
  pendingDeleteId = id;
  confirmOverlay.classList.add("show");
}

document.getElementById("confirmYes").addEventListener("click", () => {
  if (pendingDeleteId) {
    menuCollection.doc(pendingDeleteId).delete().catch(console.error);
    if (pendingDeleteId === activeId) closeContent();
  }
  pendingDeleteId = null;
  confirmOverlay.classList.remove("show");
});

document.getElementById("confirmNo").addEventListener("click", () => {
  pendingDeleteId = null;
  confirmOverlay.classList.remove("show");
});

/* -------- 메뉴 추가 -------- */
const menuNameInput = document.getElementById("menuNameInput");
const menuLinkInput = document.getElementById("menuLinkInput");

document.getElementById("addLinkBtn").addEventListener("click", async () => {
  const name = menuNameInput.value.trim();
  let link = menuLinkInput.value.trim();
  if (!name || !link) return;
  if (!/^https?:\/\//i.test(link)) link = "https://" + link;

  await menuCollection.add({
    name,
    link,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  menuNameInput.value = "";
  menuLinkInput.value = "";
});

/* -------- 우측 콘텐츠 영역 전환 -------- */
const waitingScreen = document.getElementById("waitingScreen");
const contentFrame = document.getElementById("contentFrame");
const closeContentBtn = document.getElementById("closeContentBtn");

function openLink(id, url){
  activeId = id;
  document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
  contentFrame.src = url;
  waitingScreen.style.display = "none";
  contentFrame.style.display = "block";
  closeContentBtn.style.display = "block";
  // 활성 표시 갱신을 위해 목록 재렌더는 다음 스냅샷에서 자동 반영됨
}

function closeContent(){
  activeId = null;
  contentFrame.src = "about:blank";
  contentFrame.style.display = "none";
  waitingScreen.style.display = "flex";
  closeContentBtn.style.display = "none";
}

closeContentBtn.addEventListener("click", closeContent);

/* =====================================================================
   유튜브 배경 음악 재생 / 정지 (반복재생)
   → 아래 YOUTUBE_VIDEO_ID를 원하는 영상의 ID로 교체하세요.
   ===================================================================== */
const YOUTUBE_VIDEO_ID = "LvytTVeTxCE";

let ytPlayer = null;
let ytReady = false;
let pendingPlay = false; // API 로딩 전에 재생 버튼을 눌렀을 때를 대비한 대기열

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player("ytHost", {
    height: "1",
    width: "1",
    videoId: "LvytTVeTxCE",
    playerVars: { autoplay: 0, controls: 0 },
    events: {
      onReady: () => {
        ytReady = true;
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        if (pendingPlay) {
          ytPlayer.playVideo();
          pendingPlay = false;
        }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) {
          ytPlayer.seekTo(0);
          ytPlayer.playVideo();
        }
      }
    }
  });
};

const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");

playBtn.addEventListener("click", () => {
  playBtn.classList.add("active");
  pauseBtn.classList.remove("active");

  if (!ytReady) {
    // API가 아직 로딩 중이면, 로딩 완료 후 자동 재생되도록 예약만 해둠
    pendingPlay = true;
    return;
  }
  ytPlayer.unMute();
  ytPlayer.setVolume(100);
  ytPlayer.playVideo();
});
pauseBtn.addEventListener("click", () => {
  pendingPlay = false;
  pauseBtn.classList.add("active");
  playBtn.classList.remove("active");
  if (!ytReady) return;
  ytPlayer.pauseVideo();
});
</script>

</body>
</html>
