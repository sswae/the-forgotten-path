<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KsiS — The Forgotten Path</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Press+Start+2P&family=Asta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<!-- ============================================================
  Firebase (compat SDK)
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- webp 이미지 저장을 위한 Storage 추가 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
  :root{
    --sidebar-bg-top:#1c3a2d;
    --sidebar-bg-bottom:#122019;
    --main-bg:#141414;
    --gold:#c8a24a;
    --gold-dim:#8a7534;
    --green:#4f8a6d;
    --green-dim:#2c5443;
    --green-light:#a9d3bf;
    --text:#e7e7df;
    --text-dim:#7f9188;
    --danger:#b5533f;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;
    background:var(--main-bg);
    font-family:'Press Start 2P', monospace;
    color:var(--text);
    overflow:hidden;
    cursor: url('./cursor.png') 0 0, auto;
  }

  /* -------- 픽셀 버튼(눌림 베벨) 공통 스타일 -------- */
  .pixel-btn{
    font-family:'Press Start 2P', monospace;
    cursor:pointer;
    box-shadow:
      inset -2px -2px 0 0 rgba(0,0,0,.45),
      inset 2px 2px 0 0 rgba(255,255,255,.22);
  }
  .pixel-btn:active{
    box-shadow:
      inset 2px 2px 0 0 rgba(0,0,0,.45),
      inset -2px -2px 0 0 rgba(255,255,255,.22);
  }

  /* -------- RPG 대화창 스타일 테두리 박스 -------- */
  .rpg-box{
    border:2px solid var(--gold);
    outline:1px solid var(--gold-dim);
    outline-offset:-6px;
  }

  /* ================= SIDEBAR ================= */
  #sidebar{
    width:320px;
    min-width:320px;
    height:100vh;
    background:linear-gradient(180deg,var(--sidebar-bg-top),var(--sidebar-bg-bottom));
    border-right:2px solid var(--gold-dim);
    display:flex;
    flex-direction:column;
    padding:22px 20px;
    gap:22px;
    overflow:hidden;
  }

  .logo-mini{
    font-family:'Uncial Antiqua',serif;
    font-weight:900;
    font-size:36px;
    letter-spacing:1px;
    color:var(--gold);
    line-height:1;
  }
  .logo-mini-sub{
    font-size:8px;
    letter-spacing:1px;
    color:var(--text-dim);
    margin-top:8px;
    font-family:'Press Start 2P', monospace;
  }

  /* -------- youtube player controls -------- */
  .player-row{
    display:flex;
    gap:10px;
  }
  .player-btn{
    width:44px;height:44px;
    background:var(--green-dim);
    border:2px solid var(--green);
    color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:14px;
  }
  .player-btn:hover{background:var(--green);color:#0e1a15;}
  .player-btn.active{background:var(--gold);color:#0e1a15;}
  #ytHost{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;}

  /* -------- add-link form -------- */
  .menu-form{
    background:#0f1c16;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .field-row{display:flex;align-items:center;gap:8px;min-width:0;}
  .field-label{
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-dim);
    width:52px;
    flex-shrink:0;
  }
  .field-input{
    flex:1;
    min-width:0;
    background:var(--green-dim);
    border:2px solid var(--green);
    color:var(--text);
    padding:8px 8px;
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    outline:none;
    box-shadow:inset -2px -2px 0 0 rgba(0,0,0,.4), inset 2px 2px 0 0 rgba(0,0,0,.2);
  }
  .field-input::placeholder{color:#9fbcae;opacity:.5;}
  .field-input:focus{border-color:var(--gold);}
  
  .action-btn{
    align-self:flex-end;
    background:var(--green-dim);
    border:2px solid var(--green);
    color:var(--gold);
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    letter-spacing:1px;
    cursor:pointer;
    padding:8px 10px;
  }
  .action-btn:hover{background:var(--green);color:#0e1a15;}

  /* -------- standalone gallery toggle -------- */
  .gallery-toggle-btn{
    background:#0f1c16;
    color:var(--gold);
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:1px;
    padding:14px 12px;
    width:100%;
    text-align:center;
    flex-shrink:0;
  }
  .gallery-toggle-btn:hover{
    background:var(--green-dim);
    color:#fff;
  }

  /* -------- menu list -------- */
  #menuList{
    list-style:none;
    margin:0;padding:0;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    scrollbar-width:thin;
    scrollbar-color:var(--green) transparent;
  }
  #menuList::-webkit-scrollbar{width:6px;}
  #menuList::-webkit-scrollbar-thumb{background:var(--green-dim);}

  .menu-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:10px 8px;
    cursor:pointer;
    border-left:3px solid transparent;
    font-family:'Asta Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    line-height:1.7;
    word-break:break-word;
    color:var(--text-dim);
  }
  .menu-item:hover{color:var(--text);background:rgba(79,138,109,.15);}
  .menu-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(200,162,74,.08);}
  .menu-item .x-btn{
    color:var(--danger);
    flex-shrink:0;
    font-size:11px;
    margin-top:2px;
    opacity:.55;
  }
  .menu-item:hover .x-btn{opacity:1;}
  .menu-item .m-name{flex:1;}

  .empty-hint{
    color:var(--text-dim);
    font-family:'Asta Sans', sans-serif;
    font-size:12px;
    line-height:1.8;
    padding:10px 8px;
    letter-spacing:1px;
  }

  /* ================= MAIN CONTENT ================= */
  #main{
    flex:1;
    height:100vh;
    position:relative;
    background:
      radial-gradient(ellipse at 50% 40%, #1c1c1c 0%, #0d0d0d 75%);
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--green-dim) #141414;
  }
  #main::-webkit-scrollbar{width:8px;}
  #main::-webkit-scrollbar-thumb{background:var(--green-dim);}

  #waitingScreen{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
  }
  .logo-big{
    font-family:'Uncial Antiqua',serif;
    font-weight:900;
    font-size:min(13vw,170px);
    letter-spacing:8px;
    color:var(--gold);
    line-height:1;
  }
  .logo-big-sub{
    font-family:'Press Start 2P', monospace;
    font-weight:600;
    font-size:20px;
    letter-spacing:6px;
    color:#f2f2ea;
    margin-top:16px;
  }
  .logo-tagline{
    margin-top:36px;
    font-family:'Press Start 2P', monospace;
    font-size:15px;
    letter-spacing:3px;
    color:#cfd8d2;
  }
  .logo-copyright{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:1px;
    color:#9aa39d;
  }
  .logo-hint{
    margin-top:40px;
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    letter-spacing:2px;
    color:var(--gold);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .logo-hint{animation:none;}
  }

  #contentFrame{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:none;
    display:none;
    background:#000;
  }

  /* ================= GALLERY SCREEN ================= */
  #galleryScreen{
    display:none;
    padding:40px;
    min-height: 100%;
  }
  
  .gallery-header {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 30px;
    border-bottom: 2px dashed var(--green-dim);
    padding-bottom: 20px;
    margin-bottom: 30px;
  }

  .gallery-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 24px;
    color: var(--gold);
    text-shadow: 2px 2px 0 #000;
  }

  #galleryGrid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 30px;
  }

  .gallery-card {
    background: #0f1c16;
    display: flex;
    flex-direction: column;
    padding: 15px;
    position: relative;
  }

  .gallery-file-label {
    background: var(--green-dim);
    color: var(--gold);
    font-size: 10px;
    padding: 6px 0;
    text-align: center;
    border: 1px solid var(--green);
    margin-bottom: 15px;
    letter-spacing: 1px;
  }

  .gallery-img-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border: 2px solid var(--green-dim);
    margin-bottom: 15px;
    cursor: pointer;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gallery-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
  }

  .gallery-img-wrap:hover img {
    transform: scale(1.05);
  }

  .gallery-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .gallery-post-title {
    font-family: 'Asta Sans', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    word-break: break-all;
  }

  .gallery-post-title::before {
    content: "■ ";
    color: var(--gold);
    font-size: 10px;
    vertical-align: middle;
  }

  .gallery-date {
    font-size: 10px;
    color: var(--text-dim);
    text-align: right;
    margin-top: auto;
  }

  .gallery-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
  }

  .gallery-actions button {
    flex: 1;
    padding: 6px;
    font-size: 9px;
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--text-dim);
  }

  .gallery-actions button:hover {
    background: var(--green-dim);
    color: var(--text);
  }

  /* ================= TOP RIGHT BUTTONS ================= */
  .top-btn-group {
    position:fixed;
    top:14px;right:18px;
    z-index:5;
    display:flex;
    gap:10px;
  }

  .top-btn {
    display:none;
    background:rgba(20,20,20,.85);
    border:2px solid var(--gold-dim);
    color:var(--gold);
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    padding:8px 12px;
    cursor:pointer;
    letter-spacing:1px;
  }
  .top-btn:hover{border-color:var(--gold);color:#fff;}
  .top-btn.green-btn { border-color:var(--green); color:var(--green-light); }
  .top-btn.green-btn:hover { border-color:var(--green-light); color:#fff; }

  /* ================= MODALS ================= */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
  }
  .modal-overlay.show{display:flex;}

  /* Confirm Modal */
  .confirm-box{
    background:#0f1c16;
    padding:30px 34px;
    max-width:320px;
    text-align:center;
  }
  .confirm-text{
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    line-height:2;
    color:var(--text);
    margin:0 0 26px;
  }
  .confirm-actions{
    display:flex;
    gap:14px;
    justify-content:center;
  }
  .confirm-actions .pixel-btn{
    font-size:12px;
    padding:10px 18px;
    background:var(--green-dim);
    color:var(--gold);
    border:2px solid var(--green);
  }
  
  button, .pixel-btn, .menu-item {
    cursor: url('./cursor.png'), pointer !important;
  }
  .confirm-actions .pixel-btn:hover{background:var(--green);color:#0e1a15;}
  .btn-danger{border-color:var(--danger) !important;}
  .btn-danger:hover{background:var(--danger) !important;color:#fff !important;}

  /* Gallery Form Modal */
  .form-box {
    position: relative;
    background:#0f1c16;
    padding:25px;
    width: 400px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  .form-title {
    font-family:'Press Start 2P', monospace;
    color: var(--gold);
    font-size: 14px;
    margin: 0 0 10px 0;
    text-align: center;
  }

  .form-box .field-row {
    flex-direction: column;
    align-items: stretch;
    gap: 5px;
  }

  .form-box .field-label {
    width: auto;
  }
  
  .form-box input[type="file"] {
    background: var(--green-dim);
    color: var(--text);
    font-family: 'Asta Sans', sans-serif;
    font-size: 12px;
    padding: 8px;
    border: 2px solid var(--green);
  }

  /* Image View Modal */
  .img-view-box {
    max-width: 90vw;
    max-height: 90vh;
    position: relative;
  }
  
  .img-view-box img {
    max-width: 100%;
    max-height: 90vh;
    border: 2px solid var(--gold);
    display: block;
  }
  
  .close-img-btn {
    position: absolute;
    top: -30px;
    right: 0;
    background: none;
    border: none;
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    cursor: pointer;
  }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 28, 22, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    z-index: 10;
  }
</style>
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">

    <div>
      <div class="logo-mini">KasiS</div>
      <div class="logo-mini-sub">THE FORGOTTEN PATH</div>
    </div>

    <div class="player-row">
      <div class="player-btn pixel-btn" id="playBtn" title="재생">▶</div>
      <div class="player-btn pixel-btn" id="pauseBtn" title="정지">❚❚</div>
    </div>
    <div id="ytHost"></div>

    <div class="menu-form rpg-box">
      <div class="field-row">
        <span class="field-label">MENU</span>
        <input class="field-input" id="menuNameInput" placeholder="title" maxlength="24">
      </div>
      <div class="field-row">
        <span class="field-label">LINK</span>
        <input class="field-input" id="menuLinkInput" placeholder="https://...">
      </div>
      <button class="action-btn pixel-btn" id="addLinkBtn">+ ADD LINK</button>
    </div>

    <!-- 분리된 Save/Load 버튼 -->
    <button class="gallery-toggle-btn pixel-btn rpg-box" id="galleryBtn">SAVE / LOAD</button>

    <ul id="menuList">
      <li class="empty-hint">🤷‍♀️ NO LINK</li>
    </ul>

  </aside>

  <!-- ================= MAIN ================= -->
  <main id="main">
    <div class="top-btn-group">
      <button id="openNewTabBtn" class="top-btn green-btn pixel-btn">↗ NEW TAB</button>
      <button id="closeContentBtn" class="top-btn pixel-btn">✕ CLOSE</button>
    </div>

    <div id="waitingScreen">
      <div class="logo-big">KasiS</div>
      <div class="logo-big-sub">THE FORGOTTEN PATH</div>
      <div class="logo-tagline">A DOS ADVENTURE</div>
      <div class="logo-copyright">(C) 1991 PIXELCAT SOFTWARE</div>
      <div class="logo-hint">▶ Please select a way... ◀</div>
    </div>

    <iframe id="contentFrame"></iframe>

    <!-- 갤러리 스크린 -->
    <div id="galleryScreen">
      <div class="gallery-header">
        <div class="gallery-title">GAME DATA</div>
        <button id="openWriteModalBtn" class="action-btn pixel-btn" style="width:auto; padding: 10px 20px;">+ SAVE</button>
      </div>
      <div id="galleryGrid">
        <!-- 갤러리 아이템 렌더링 영역 -->
      </div>
    </div>
  </main>

  <!-- ================= 삭제 확인 모달 ================= -->
  <div id="confirmOverlay" class="modal-overlay">
    <div class="confirm-box rpg-box">
      <p class="confirm-text">정말로<br>삭제하시겠습니까?</p>
      <div class="confirm-actions">
        <button id="confirmYes" class="pixel-btn btn-danger">예</button>
        <button id="confirmNo" class="pixel-btn">아니오</button>
      </div>
    </div>
  </div>

  <!-- ================= 갤러리 작성/수정 모달 ================= -->
  <div id="galleryFormOverlay" class="modal-overlay">
    <div class="form-box rpg-box">
      <div id="formLoading" class="loading-overlay">SAVING...</div>
      <h3 class="form-title" id="formTitle">NEW DATA</h3>
      <input type="hidden" id="galleryEditId">
      
      <div class="field-row">
        <span class="field-label">TITLE</span>
        <input class="field-input" id="galleryTitleInput" placeholder="시나리오명" maxlength="30">
      </div>
      
      <div class="field-row">
        <span class="field-label">DATE</span>
        <input class="field-input" id="galleryDateInput" placeholder="20XX-XX-XX">
      </div>
      
      <div class="field-row">
        <span class="field-label">CARD</span>
        <input type="file" id="galleryImageInput" accept="image/png, image/jpeg, image/jpg, image/gif, image/webp">
        <span style="font-size:9px; color:var(--text-dim); margin-top:4px;">* 모든 이미지는 webp로 자동 변환되어 저장됩니다.</span>
      </div>

      <div class="confirm-actions" style="margin-top: 15px;">
        <button id="gallerySaveBtn" class="pixel-btn">SAVE</button>
        <button id="galleryCancelBtn" class="pixel-btn btn-danger">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- ================= 이미지 원본 뷰어 모달 ================= -->
  <div id="imageViewOverlay" class="modal-overlay">
    <div class="img-view-box">
      <button class="close-img-btn" id="closeImageViewBtn">✕</button>
      <img id="fullSizeImage" src="" alt="Full size">
    </div>
  </div>

<script>
/* =====================================================================
   Firebase 설정
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDdwSkHiw0l9XsRSOrf6_1r0Izitb7PV9U",
  authDomain: "kasis-tfp.firebaseapp.com",
  databaseURL: "https://kasis-tfp-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kasis-tfp",
  storageBucket: "kasis-tfp.firebasestorage.app",
  messagingSenderId: "973760135804",
  appId: "1:973760135804:web:34383d9ca53d2c39bffff9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();
const menuCollection = db.collection("menuItems");
const galleryCollection = db.collection("galleryItems");

/* =====================================================================
   메뉴 목록 (Links)
   ===================================================================== */
const menuListEl = document.getElementById("menuList");
let activeId = null;

menuCollection.orderBy("createdAt", "asc").onSnapshot(snapshot => {
  menuListEl.innerHTML = "";
  if (snapshot.empty) {
    menuListEl.innerHTML = `<li class="empty-hint">🤷‍♀️ NO LINK</li>`;
    return;
  }
  snapshot.forEach(doc => {
    const data = doc.data();
    const li = document.createElement("li");
    li.className = "menu-item" + (doc.id === activeId ? " active" : "");
    li.innerHTML = `<span class="x-btn">✕</span><span class="m-name"></span>`;
    li.querySelector(".m-name").textContent = data.name;

    li.addEventListener("click", (e) => {
      if (e.target.classList.contains("x-btn")) return;
      openLink(doc.id, data.link);
    });

    li.querySelector(".x-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      requestDelete('menu', doc.id);
    });
    li.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      requestDelete('menu', doc.id);
    });

    menuListEl.appendChild(li);
  });
}, err => {
  console.error(err);
});

/* -------- 링크 추가 -------- */
const menuNameInput = document.getElementById("menuNameInput");
const menuLinkInput = document.getElementById("menuLinkInput");
document.getElementById("addLinkBtn").addEventListener("click", async () => {
  const name = menuNameInput.value.trim();
  let link = menuLinkInput.value.trim();
  if (!name || !link) return;
  if (!/^https?:\/\//i.test(link)) link = "https://" + link;

  await menuCollection.add({
    name, link, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  menuNameInput.value = "";
  menuLinkInput.value = "";
});

/* =====================================================================
   공통 삭제 모달 로직
   ===================================================================== */
const confirmOverlay = document.getElementById("confirmOverlay");
let deleteTarget = { type: null, id: null, extra: null }; 

function requestDelete(type, id, extra = null){
  deleteTarget = { type, id, extra };
  confirmOverlay.classList.add("show");
}

document.getElementById("confirmYes").addEventListener("click", async () => {
  if (deleteTarget.type === 'menu') {
    menuCollection.doc(deleteTarget.id).delete().catch(console.error);
    if (deleteTarget.id === activeId) closeContent();
  } else if (deleteTarget.type === 'gallery') {
    try {
      if (deleteTarget.extra) {
        const fileRef = storage.refFromURL(deleteTarget.extra);
        await fileRef.delete().catch(() => {});
      }
      await galleryCollection.doc(deleteTarget.id).delete();
    } catch (e) {
      console.error(e);
    }
  }
  
  deleteTarget = { type: null, id: null, extra: null };
  confirmOverlay.classList.remove("show");
});

document.getElementById("confirmNo").addEventListener("click", () => {
  deleteTarget = { type: null, id: null, extra: null };
  confirmOverlay.classList.remove("show");
});

/* =====================================================================
   갤러리 구현 (WebP 변환 및 CRUD)
   ===================================================================== */
const galleryGrid = document.getElementById("galleryGrid");
const galleryFormOverlay = document.getElementById("galleryFormOverlay");
const openWriteModalBtn = document.getElementById("openWriteModalBtn");
const gallerySaveBtn = document.getElementById("gallerySaveBtn");
const galleryCancelBtn = document.getElementById("galleryCancelBtn");
const formLoading = document.getElementById("formLoading");

const galleryEditId = document.getElementById("galleryEditId");
const galleryTitleInput = document.getElementById("galleryTitleInput");
const galleryDateInput = document.getElementById("galleryDateInput");
const galleryImageInput = document.getElementById("galleryImageInput");
const formTitle = document.getElementById("formTitle");

let currentGalleryData = [];

function convertToWebP(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("WebP 변환에 실패했습니다. 브라우저가 WebP 인코딩을 지원하지 않을 수 있습니다."));
        }, 'image/webp', 0.8);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

galleryCollection.orderBy("createdAt", "asc").onSnapshot(snapshot => {
  galleryGrid.innerHTML = "";
  currentGalleryData = [];
  let index = 1;

  snapshot.forEach(doc => {
    const data = doc.data();
    currentGalleryData.push({ id: doc.id, ...data });

    const card = document.createElement("div");
    card.className = "gallery-card rpg-box";
    card.innerHTML = `
      <div class="gallery-file-label">File ${index}</div>
      <div class="gallery-img-wrap">
        <img src="${data.imageUrl}" alt="thumbnail" data-src="${data.imageUrl}">
      </div>
      <div class="gallery-info">
        <div class="gallery-post-title">${data.title}</div>
        <div class="gallery-date">${data.date}</div>
      </div>
      <div class="gallery-actions">
        <button class="pixel-btn edit-btn">EDIT</button>
        <button class="pixel-btn del-btn">DEL</button>
      </div>
    `;

    card.querySelector(".gallery-img-wrap").addEventListener("click", () => {
      document.getElementById("fullSizeImage").src = data.imageUrl;
      document.getElementById("imageViewOverlay").classList.add("show");
    });

    card.querySelector(".edit-btn").addEventListener("click", () => {
      galleryEditId.value = doc.id;
      galleryTitleInput.value = data.title;
      galleryDateInput.value = data.date;
      galleryImageInput.value = "";
      formTitle.textContent = "EDIT DATA";
      galleryFormOverlay.classList.add("show");
    });

    card.querySelector(".del-btn").addEventListener("click", () => {
      requestDelete('gallery', doc.id, data.imageUrl);
    });

    galleryGrid.appendChild(card);
    index++;
  });
}, err => console.error("Gallery Sync Error: ", err));

openWriteModalBtn.addEventListener("click", () => {
  galleryEditId.value = "";
  galleryTitleInput.value = "";
  galleryDateInput.value = "";
  galleryImageInput.value = "";
  formTitle.textContent = "NEW DATA";
  galleryFormOverlay.classList.add("show");
});

galleryCancelBtn.addEventListener("click", () => {
  galleryFormOverlay.classList.remove("show");
});

document.getElementById("closeImageViewBtn").addEventListener("click", () => {
  document.getElementById("imageViewOverlay").classList.remove("show");
});
document.getElementById("imageViewOverlay").addEventListener("click", (e) => {
  if (e.target.id === "imageViewOverlay") {
    e.target.classList.remove("show");
  }
});

gallerySaveBtn.addEventListener("click", async () => {
  const id = galleryEditId.value;
  const title = galleryTitleInput.value.trim();
  const date = galleryDateInput.value.trim();
  const file = galleryImageInput.files[0];

  if (!title || !date) return alert("제목과 날짜를 입력하십시오.");
  if (!id && !file) return alert("이미지를 첨부하십시오.");

  formLoading.style.display = "flex";

  try {
    let imageUrl = null;
    
    if (file) {
      const webpBlob = await convertToWebP(file);
      const filename = `gallery_${Date.now()}.webp`;
      const storageRef = storage.ref().child('gallery/' + filename);
      await storageRef.put(webpBlob);
      imageUrl = await storageRef.getDownloadURL();
    }

    if (id) {
      const updateData = { title, date };
      if (imageUrl) updateData.imageUrl = imageUrl;
      await galleryCollection.doc(id).update(updateData);
    } else {
      await galleryCollection.add({
        title, date, imageUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    galleryFormOverlay.classList.remove("show");
  } catch (error) {
    console.error("Upload failed: ", error);
    alert("오류가 발생했습니다.\n[" + (error && (error.code || error.name) || "unknown") + "] " + (error && error.message ? error.message : error));
  } finally {
    formLoading.style.display = "none";
  }
});

/* =====================================================================
   유튜브 배경 음악 재생
   ===================================================================== */
const YOUTUBE_VIDEO_ID = "LvytTVeTxCE";
let ytPlayer = null;
let ytReady = false;
let pendingPlay = false; 

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player("ytHost", {
    height: "1", width: "1", videoId: "-y7IvGpq3a0",
    playerVars: { autoplay: 0, controls: 0 },
    events: {
      onReady: () => {
        ytReady = true;
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        if (pendingPlay) { ytPlayer.playVideo(); pendingPlay = false; }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) {
          ytPlayer.seekTo(0); ytPlayer.playVideo();
        }
      }
    }
  });
};

const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");

playBtn.addEventListener("click", () => {
  playBtn.classList.add("active"); pauseBtn.classList.remove("active");
  if (!ytReady) { pendingPlay = true; return; }
  ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo();
});
pauseBtn.addEventListener("click", () => {
  pendingPlay = false;
  pauseBtn.classList.add("active"); playBtn.classList.remove("active");
  if (!ytReady) return; ytPlayer.pauseVideo();
});
</script>
